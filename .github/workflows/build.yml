name: InkKey Recovered Trial 10
on:
  push:
    branches: ["upper-barrel-probe-v18"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare debug signing and Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cp .env.example .env
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Apply Trial 7 source recovery
        run: python3 ../.github/workflows/trial7_patch.py
      - name: Fix Trial 7 IME root host
        run: python3 ../.github/workflows/trial7_root_fix.py
      - name: Apply Trial 8 UI fixes
        run: python3 ../.github/workflows/trial8_ui_patch.py
      - name: Apply Trial 9 input and transient UI fixes
        run: python3 ../.github/workflows/trial9_patch.py
      - name: Apply Trial 10 strict mapping and glass lens
        run: python3 ../.github/workflows/trial10_patch.py
      - name: Fix Trial 10 Compose lens sizing
        run: python3 ../.github/workflows/trial10_compile_fix.py
      - name: Test recovery and build APK
        run: gradle testDebugUnitTest --tests com.example.ContactRestartDetectorTest --tests com.example.Trial7HoverDetectorTest --tests com.example.BarrelToolControllerTest --tests com.example.RecoveredInputTest --tests com.example.Trial9InputUiLogicTest assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-Recovered-Trial-10
          path: recovered/app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-Trial-10-Test-Reports
          path: recovered/app/build/test-results/testDebugUnitTest/
