name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Clean Source Tree & .env
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          fi
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v2.4 (V18_TRIGGER Toggle + 0.115f Hold-Erase + Probe Logger)
        run: |
          python3 - << 'EOF'
          import os, sys

          def replace_kotlin_fun(source, fun_signature, new_fun_code):
              idx = source.find(fun_signature)
              if idx == -1:
                  print(f"ERROR: Could not find {fun_signature}")
                  sys.exit(1)
              brace_start = source.find("{", idx)
              depth = 0
              end_idx = -1
              for i in range(brace_start, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end_idx = i + 1
                          break
              return source[:idx] + new_fun_code + source[end_idx:]

          # 1. Bump version to 2.4 (versionCode 14)
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              bg = f.read()
          for old_vc in ['versionCode = 13', 'versionCode = 12', 'versionCode = 4']:
              bg = bg.replace(old_vc, 'versionCode = 14')
          for old_vn in ['versionName = "2.3"', 'versionName = "2.2"', 'versionName = "1.3"']:
              bg = bg.replace(old_vn, 'versionName = "2.4"')
          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(bg)

          # 2. Update HandwritingCanvas.kt with V18_TRIGGER (<0.0090f) + Tap-Toggle + Hold-to-Erase (>=0.115f)
          hc_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          with open(hc_path, "r", encoding="utf-8") as f:
              hc = f.read()

          if "var upperBarrelHoldEraseActive" not in hc:
              hc = hc.replace(
                  "var prevBarrel2Pressed by remember { mutableStateOf(false) }",
                  """var prevBarrel2Pressed by remember { mutableStateOf(false) }
              var upperBarrelHoldEraseActive by remember { mutableStateOf(false) }
              var lastSubFloorToggleTime by remember { mutableStateOf(0L) }
              var upperDownStartTime by remember { mutableStateOf(0L) }
              var upperDownStartPos by remember { mutableStateOf(Offset.Zero) }
              var upperDragDistance by remember { mutableStateOf(0f) }"""
              )
          elif "var upperDownStartTime" not in hc:
              hc = hc.replace(
                  "var lastSubFloorToggleTime by remember { mutableStateOf(0L) }",
                  """var lastSubFloorToggleTime by remember { mutableStateOf(0L) }
              var upperDownStartTime by remember { mutableStateOf(0L) }
              var upperDownStartPos by remember { mutableStateOf(Offset.Zero) }
              var upperDragDistance by remember { mutableStateOf(0f) }"""
              )

          start_marker = "val isStylusDevice = toolType == MotionEvent.TOOL_TYPE_STYLUS"
          end_marker = "|| upperBarrelHoldEraseActive"
          old_upper_line = "val isUpperBarrel = if (tabletConfig.swapBarrelButtons) rawLower else rawUpper"

          v24_upper_block = """val isStylusDevice = toolType == MotionEvent.TOOL_TYPE_STYLUS
                      val rawP = motionEvent.pressure
                      val firstTouchPressure = if (motionEvent.historySize > 0) motionEvent.getHistoricalPressure(0) else rawP
                      var minSamplePressure = rawP
                      for (h in 0 until motionEvent.historySize) {
                          val hp = motionEvent.getHistoricalPressure(h)
                          if (hp < minSamplePressure) minSamplePressure = hp
                      }

                      // Record into ButtonProbe log
                      viewModel.recordProbeMotionEvent(motionEvent, firstTouchPressure, minSamplePressure)

                      if (isStylusDevice && !isHardwareEraser && buttonState == 0) {
                          when (motionEvent.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  upperDownStartTime = System.currentTimeMillis()
                                  upperDownStartPos = Offset(motionEvent.x, motionEvent.y)
                                  upperDragDistance = 0f

                                  // Signature A: Initial contact pressure spike >= 0.115f (Normal writing starts at 0.010f..0.095f)
                                  // OR V18 sub-floor packet (0.0001f..0.0090f, below 0.009949f normal floor)
                                  if (firstTouchPressure >= 0.115f || (minSamplePressure > 0f && minSamplePressure <= 0.0090f)) {
                                      upperBarrelHoldEraseActive = true
                                      viewModel.cancelLiveStroke()
                                  } else {
                                      upperBarrelHoldEraseActive = false
                                  }
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val moveDist = (Offset(motionEvent.x, motionEvent.y) - upperDownStartPos).getDistance()
                                  if (moveDist > upperDragDistance) upperDragDistance = moveDist

                                  // Signature B (V18_TRIGGER): Sub-floor pressure packet (0.0001f..0.0090f) during move/lift
                                  if (minSamplePressure > 0f && minSamplePressure <= 0.0090f) {
                                      val now = System.currentTimeMillis()
                                      if (!upperBarrelHoldEraseActive && now - lastSubFloorToggleTime > 280L) {
                                          lastSubFloorToggleTime = now
                                          viewModel.cancelLiveStroke()
                                          val nextT = if (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER) ToolType.PEN else ToolType.STROKE_ERASER
                                          viewModel.setTool(nextT)
                                          viewModel.onV18SubFloorTrigger(minSamplePressure, nextT)
                                      }
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  val pressDuration = System.currentTimeMillis() - upperDownStartTime
                                  val wasQuickTap = pressDuration < 280L && upperDragDistance < 32f
                                  if (upperBarrelHoldEraseActive && wasQuickTap) {
                                      // Quick tap while holding Upper Barrel -> Permanently toggle PEN <-> STROKE_ERASER!
                                      val now = System.currentTimeMillis()
                                      if (now - lastSubFloorToggleTime > 250L) {
                                          lastSubFloorToggleTime = now
                                          viewModel.cancelLiveStroke()
                                          val nextT = if (prevBarrelTool == ToolType.STROKE_ERASER || prevBarrelTool == ToolType.AREA_ERASER) ToolType.PEN else ToolType.STROKE_ERASER
                                          prevBarrelTool = nextT
                                          viewModel.setTool(nextT)
                                          viewModel.onV18SubFloorTrigger(firstTouchPressure, nextT)
                                      }
                                  }
                                  upperBarrelHoldEraseActive = false
                              }
                          }
                      }

                      val isUpperBarrel = (if (tabletConfig.swapBarrelButtons) rawLower else rawUpper) || upperBarrelHoldEraseActive"""

          if start_marker in hc and end_marker in hc:
              s_idx = hc.find(start_marker)
              e_idx = hc.find(end_marker, s_idx) + len(end_marker)
              hc = hc[:s_idx] + v24_upper_block
              
