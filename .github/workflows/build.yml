name: InkKey
on:
  push:
    branches: [main, upper-barrel-probe-v18]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: inkkey-signing-v1
      - name: Prepare signing and Android SDK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.INKKEY_SIGNING_KEY_BASE64 }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cp .env.example .env
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=InkKey,O=InkKey,C=IN"
          fi
      - name: Run all unit tests, lint, and build APK
        env:
          STORE_PASSWORD: ${{ secrets.INKKEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.INKKEY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INKKEY_KEY_ALIAS }}
        run: gradle testDebugUnitTest lintRelease assembleRelease --no-daemon
      - name: Name installable APK
        run: cp app/build/outputs/apk/release/app-release.apk InkKey-3.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-3.0
          path: InkKey-3.0.apk
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-Verification
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
