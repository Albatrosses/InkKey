name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Project
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          elif [ -f inkkey.zip ]; then
            unzip -o inkkey.zip
            rm -f inkkey.zip
          fi
          for dir in inkkey project InkKey; do
            if [ ! -f settings.gradle.kts ] && [ -d "$dir" ]; then
              mv "$dir"/* . 2>/dev/null || true
              mv "$dir"/.* . 2>/dev/null || true
            fi
          done
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v2.1 Fixes (Full Hardware Signal Interceptor)
        run: |
          python3 - << 'EOF'
          import os

          # 1. Update version to 2.1 in app/build.gradle.kts
          app_gradle_path = "app/build.gradle.kts"
          with open(app_gradle_path, "r", encoding="utf-8") as f:
              bg = f.read()
          bg = bg.replace('versionCode = 4', 'versionCode = 11').replace('versionName = "1.3"', 'versionName = "2.1"')
          with open(app_gradle_path, "w", encoding="utf-8") as f:
              f.write(bg)
          print("1. Patched app/build.gradle.kts")

          # 2. Patch MainActivity.kt to intercept ALL KeyEvents (including KEYCODE_BACK/Right-Click & scanCodes from XP-Pen 0x28BD)
          #    and ALL Touch/Hover MotionEvents where any button or toolType changes!
          main_activity_path = "app/src/main/java/com/example/MainActivity.kt"
          with open(main_activity_path, "r", encoding="utf-8") as f:
              ma = f.read()

          old_ma_events = """    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleHardwareKeyEvent(event.keyCode, event.scanCode, event)) {
                  return true
              }
              return super.dispatchKeyEvent(event)
          }
          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleGenericMotionEvent(event)) {
                  return true
              }
              return super.dispatchGenericMotionEvent(event)
          }"""

          new_ma_events = """    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
              val vm = mainViewModel
              val dev = event.device
              val isFromTablet = dev != null && (dev.vendorId == 0x28BD || dev.name.contains("Deco", true) || dev.name.contains("UGTABLET", true) || (dev.sources and android.view.InputDevice.SOURCE_STYLUS) != 0)
              // If XP-Pen sends KEYCODE_BACK (4) from Upper Barrel (Android maps Right-Click / Stylus 2 to Back!), intercept it as Upper Barrel!
              if (isFromTablet && (event.keyCode == KeyEvent.KEYCODE_BACK || event.keyCode == KeyEvent.KEYCODE_UNKNOWN || event.scanCode != 0)) {
                  if (vm != null && vm.handleHardwareKeyEvent(event.keyCode, event.scanCode, event)) {
                      return true
                  }
              }
              if (vm != null && vm.handleHardwareKeyEvent(event.keyCode, event.scanCode, event)) {
                  return true
              }
              return super.dispatchKeyEvent(event)
          }

          override fun dispatchTouchEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && (event.buttonState != 0 || event.actionButton != 0 || (event.pointerCount > 0 && event.getToolType(0) == MotionEvent.TOOL_TYPE_ERASER) || (event.pointerCount > 0 && event.getToolType(0) == MotionEvent.TOOL_TYPE_MOUSE))) {
                  vm.handleGenericMotionEvent(event)
              }
              return super.dispatchTouchEvent(event)
          }

          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleGenericMotionEvent(event)) {
                  return true
              }
              return super.dispatchGenericMotionEvent(event)
          }"""

          ma = ma.replace(old_ma_events, new_ma_events, 1)
          with open(main_activity_path, "w", encoding="utf-8") as f:
              f.write(ma)
          print("2. Patched MainActivity.kt")

          # 3. Patch MainViewModel.kt:
          #    - If XP-Pen sends KEYCODE_BACK (4), KEYCODE_FORWARD (125), KEYCODE_BUTTON_2, or scanCodes 0x14b (331 BTN_STYLUS), 0x14c (332 BTN_STYLUS2), 0x111 (273 BTN_RIGHT), 0x112 (274 BTN_MIDDLE), toggle Eraser!
          #    - Also log EVERY KeyEvent and non-empty MotionEvent to _latestDebugEvent AND show _tabletFeedbackMessage so we see the exact hardware code on screen!
          vm_path = "app/src/main/java/com/example/viewmodel/MainViewModel.kt"
          with open(vm_path, "r", encoding="utf-8") as f:
              vm = f.read()

          old_key_handler = "fun handleHardwareKeyEvent(keyCode: Int, scanCode: Int = 0, event: KeyEvent? = null): Boolean {"
          new_key_handler = """fun handleHardwareKeyEvent(keyCode: Int, scanCode: Int = 0, event: KeyEvent? = null): Boolean {
              val dev = event?.device
              val isFromTablet = dev == null || dev.vendorId == 0x28BD || dev.name.contains("Deco", true) || dev.name.contains("UGTABLET", true) || (dev.sources and android.view.InputDevice.SOURCE_STYLUS) != 0

              // Catch XP-Pen Upper Barrel sent as KEYCODE_BACK (4 = Android Right-Click), BTN_STYLUS2 (scanCode 332), BTN_RIGHT (scanCode 273), or KEYCODE_E (33)
              val isUpperBarrelKey = isFromTablet && (
                  keyCode == KeyEvent.KEYCODE_BACK ||
                  keyCode == KeyEvent.KEYCODE_FORWARD ||
                  keyCode == KeyEvent.KEYCODE_SYSRQ ||
                  scanCode == 332 || scanCode == 273 || scanCode == 274 || scanCode == 331
              )
              if (isUpperBarrelKey) {
                  if (event == null || (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0)) {
                      val nextTool = if (_currentTool.value == ToolType.STROKE_ERASER || _currentTool.value == ToolType.AREA_ERASER) {
                          ToolType.PEN
                      } else {
                          if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) ToolType.AREA_ERASER else ToolType.STROKE_ERASER
                      }
                      setTool(nextTool)
                      val msg = "Upper Barrel (Key=$keyCode Scan=$scanCode): Switched to ${nextTool.name}"
                      _tabletFeedbackMessage.value = msg
                      _latestDebugEvent.value = HardwareInputDebugEvent(
                          eventType = "KeyEvent (ACTION_DOWN)",
                          deviceName = dev?.name ?: "UGTABLET Deco Mini7 V2",
                          deviceId = dev?.id ?: 0,
                          vendorId = dev?.vendorId ?: 0x28BD,
                          productId = dev?.productId ?: 0x0948,
                          keyCode = keyCode,
                          keyName = KeyEvent.keyCodeToString(keyCode),
                          scanCode = scanCode,
                          source = "STYLUS UPPER BARREL KEY",
                          resolvedAction = msg
                      )
                  }
                  return true
              }"""

          vm = vm.replace(old_key_handler, new_key_handler, 1)

          # Stop empty ACTION_HOVER_MOVE (when buttonState == 0) from overwriting the Hardware Input Event Monitor!
          # This is critical so when you press a button in Settings, ACTION_HOVER_MOVE doesn't erase the monitor 1ms later!
          vm = vm.replace(
              "if (buttonState != 0 || event.actionMasked == MotionEvent.ACTION_BUTTON_PRESS || event.actionMasked == MotionEvent.ACTION_HOVER_MOVE) {",
              "if (buttonState != 0 || event.actionButton != 0 || event.actionMasked == MotionEvent.ACTION_BUTTON_PRESS || event.actionMasked == MotionEvent.ACTION_BUTTON_RELEASE || isEraserTool) {"
          )

          # Also include BUTTON_SECONDARY (2) and actionButton in rawUpper inside MainViewModel.handleGenericMotionEvent
          vm = vm.replace(
              "val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0",
              "val rawUpper = ((buttonState or event.actionButton) and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0"
          )

          with open(vm_path, "w", encoding="utf-8") as f:
              f.write(vm)
          print("3. Patched MainViewModel.kt")

          # 4. Patch TabletModels.kt (Default upperBarrelAction to STROKE_ERASER)
          tablet_models_path = "app/src/main/java/com/example/model/TabletModels.kt"
          with open(tablet_models_path, "r", encoding="utf-8") as f:
              tm = f.read()
          tm = tm.replace("val upperBarrelAction: TabletAction = TabletAction.HAND", "val upperBarrelAction: TabletAction = TabletAction.STROKE_ERASER")
          tm = tm.replace("TabletAction.HAND.id", "TabletAction.STROKE_ERASER.id")
          tm = tm.replace("?: TabletAction.HAND", "?: TabletAction.STROKE_ERASER")
          with open(tablet_models_path, "w", encoding="utf-8") as f:
              f.write(tm)
          print("4. Patched TabletModels.kt")

          # 5. Patch HandwritingCanvas.kt (Widened symbol hit-box + eraser cursor visibility)
          canvas_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          with open(canvas_path, "r", encoding="utf-8") as f:
              hc = f.read()
          hc = hc.replace("sym.hitTest(canvasX, canvasY, padding = 8f)", "sym.hitTest(canvasX, canvasY, padding = 24f)")
          hc = hc.replace(
              "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER)) {",
              "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER || prevBarrel1Pressed || prevBarrel2Pressed)) {"
          )
          with open(canvas_path, "w", encoding="utf-8") as f:
              f.write(hc)
          print("5. Patched HandwritingCanvas.kt")

          # 6. Patch InkKeyInputMethodService.kt & KeyboardCanvasView.kt so IME Keyboard ALSO catches Upper Barrel KeyEvents!
          ime_service_path = "app/src/main/java/com/example/ime/InkKeyInputMethodService.kt"
          with open(ime_service_path, "r", encoding="utf-8") as f:
              ims = f.read()
          ims_override = """    override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
              val dev = event.device
              val isFromTablet = dev != null && (dev.vendorId == 0x28BD || dev.name.contains("Deco", true) || dev.name.contains("UGTABLET", true) || (dev.sources and android.view.InputDevice.SOURCE_STYLUS) != 0)
              if (isFromTablet && (keyCode == KeyEvent.KEYCODE_BACK || keyCode == KeyEvent.KEYCODE_E || event.scanCode == 332 || event.scanCode == 273)) {
                  if (event.repeatCount == 0) {
                      val repo = com.example.ime.data.ImeDocumentRepository.getInstance(this)
                      val next = if (repo.currentTool.value == com.example.model.ToolType.STROKE_ERASER) com.example.model.ToolType.PEN else com.example.model.ToolType.STROKE_ERASER
                      repo.setTool(next)
                  }
                  return true
              }
              return super.onKeyDown(keyCode, event)
          }

          override fun onDestroy() {"""
          if "override fun onKeyDown" not in ims:
              ims = ims.replace("    override fun onDestroy() {", ims_override, 1)
              with open(ime_service_path, "w", encoding="utf-8") as f:
                  f.write(ims)
          print("6. Patched InkKeyInputMethodService.kt")

          ime_path = "app/src/main/java/com/example/ime/ui/KeyboardCanvasView.kt"
          with open(ime_path, "r", encoding="utf-8") as f:
              ime = f.read()
          ime = ime.replace("isBarrel2 -> ToolType.HAND", "isBarrel2 -> ToolType.STROKE_ERASER")
          ime = ime.replace("hitTestSymbol(sym, canvasX, canvasY, padding = 8f)", "hitTestSymbol(sym, canvasX, canvasY, padding = 22f)")
          with open(ime_path, "w", encoding="utf-8") as f:
              f.write(ime)

          # 7. Patch ShapeRecognizer.kt
          shape_path = "app/src/main/java/com/example/util/ShapeRecognizer.kt"
          with open(shape_path, "r", encoding="utf-8") as f:
              sr = f.read()
          sr_target = "if (points.size < 6) return stroke // too short to classify as shape"
          sr_inject = """if (points.size < 3) return stroke
              if (stroke.shapeType != ShapeType.NONE) {
                  val s = points.first()
                  val e = points.last()
                  val minX = points.minOf { it.x }
                  val maxX = points.maxOf { it.x }
                  val minY = points.minOf { it.y }
                  val maxY = points.maxOf { it.y }
                  val cx = (minX + maxX) / 2f
                  val cy = (minY + maxY) / 2f
                  when (stroke.shapeType) {
                      ShapeType.LINE -> return stroke.copy(points = listOf(DrawingPoint(s.x, s.y), DrawingPoint(e.x, e.y)), isShape = true, shapeType = ShapeType.LINE)
                      ShapeType.RECTANGLE -> return stroke.copy(points = listOf(DrawingPoint(minX, minY), DrawingPoint(maxX, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(minX, minY)), isShape = true, shapeType = ShapeType.RECTANGLE)
                      ShapeType.TRIANGLE -> return stroke.copy(points = listOf(DrawingPoint(cx, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(cx, minY)), isShape = true, shapeType = ShapeType.TRIANGLE)
                      ShapeType.CIRCLE -> {
                          val r = max(maxX - minX, maxY - minY) / 2f
                          val cPts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + r * cos(ang), cy + r * sin(ang), 1f)
                          }
                          return stroke.copy(points = cPts, isShape = true, shapeType = ShapeType.CIRCLE)
                      }
                      ShapeType.ELLIPSE -> {
                          val a = (maxX - minX) / 2f
                          val b = (maxY - minY) / 2f
                          val ePts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + a * cos(ang), cy + b * sin(ang), 1f)
                          }
                          return stroke.copy(points = ePts, isShape = true, shapeType = ShapeType.ELLIPSE)
                      }
                      else -> {}
                  }
              }
              if (points.size < 6) return stroke"""
          sr = sr.replace(sr_target, sr_inject, 1)
          sr = sr.replace("cv < 0.13f && angularCoverage >= 315f", "cv < 0.22f && angularCoverage >= 275f")
          sr = sr.replace("straightnessRatio >= 0.90f", "straightnessRatio >= 0.85f")
          with open(shape_path, "w", encoding="utf-8") as f:
              f.write(sr)
          print("7. Patched ShapeRecognizer.kt")
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-v2.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
