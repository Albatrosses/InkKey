name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Project
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          elif [ -f inkkey.zip ]; then
            unzip -o inkkey.zip
            rm -f inkkey.zip
          fi
          for dir in inkkey project InkKey; do
            if [ ! -f settings.gradle.kts ] && [ -d "$dir" ]; then
              mv "$dir"/* . 2>/dev/null || true
              mv "$dir"/.* . 2>/dev/null || true
            fi
          done
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v1.9 Fixes (Upper Barrel Hold-to-Erase & Toggle)
        run: |
          python3 - << 'EOF'
          import os

          # 1. Update version to 1.9 in app/build.gradle.kts
          app_gradle_path = "app/build.gradle.kts"
          with open(app_gradle_path, "r", encoding="utf-8") as f:
              bg = f.read()
          bg = bg.replace('versionCode = 4', 'versionCode = 9').replace('versionName = "1.3"', 'versionName = "1.9"')
          with open(app_gradle_path, "w", encoding="utf-8") as f:
              f.write(bg)
          print("1. Patched app/build.gradle.kts")

          # 2. Patch TabletModels.kt (Default upperBarrelAction to STROKE_ERASER)
          tablet_models_path = "app/src/main/java/com/example/model/TabletModels.kt"
          with open(tablet_models_path, "r", encoding="utf-8") as f:
              tm = f.read()
          tm = tm.replace("val upperBarrelAction: TabletAction = TabletAction.HAND", "val upperBarrelAction: TabletAction = TabletAction.STROKE_ERASER")
          tm = tm.replace("TabletAction.HAND.id", "TabletAction.STROKE_ERASER.id")
          tm = tm.replace("?: TabletAction.HAND", "?: TabletAction.STROKE_ERASER")
          with open(tablet_models_path, "w", encoding="utf-8") as f:
              f.write(tm)
          print("2. Patched TabletModels.kt")

          # 3. Patch HandwritingCanvas.kt:
          #    When user holds Upper Barrel Button and touches/drags on the tablet, XP-Pen sends ACTION_DOWN & ACTION_MOVE with pressure == 0.0f!
          #    Instead of swallowing the event (which prevented erasing!), we route 0-pressure stylus strokes directly as ERASER strokes!
          #    And when pressure > 0.0f on ACTION_DOWN, it draws normally with the Pen!
          canvas_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          with open(canvas_path, "r", encoding="utf-8") as f:
              hc = f.read()

          # Add state tracker for zero-pressure upper barrel stroke
          state_target = "var prevBarrel2Pressed by remember { mutableStateOf(false) }"
          state_inject = """var prevBarrel2Pressed by remember { mutableStateOf(false) }
              var isZeroPressureBarrelStroke by remember { mutableStateOf(false) }"""
          hc = hc.replace(state_target, state_inject, 1)

          # Replace barrel detection in HandwritingCanvas.kt so 0-pressure stylus touch activates Upper Barrel Eraser while dragging!
          old_barrel_section = """                // 3. Stylus barrel button detection & mapping (XP-PEN Deco Mini 7 V2 Stylus)
                          val buttonState = motionEvent.buttonState
                          // Lower Barrel Button (Barrel 1): BUTTON_STYLUS_PRIMARY (32) or TOOL_TYPE_ERASER
                          val rawLower = (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) || isHardwareEraser
                          // Upper Barrel Button (Barrel 2): BUTTON_STYLUS_SECONDARY (64), BUTTON_SECONDARY (2, Right-click), BUTTON_TERTIARY (4), BUTTON_FORWARD (16), BUTTON_BACK (8)
                          val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0"""

          new_barrel_section = """                // 3. Stylus barrel button detection & mapping (XP-PEN Deco Mini 7 V2 Stylus)
                          val buttonState = motionEvent.buttonState or (try { motionEvent.actionButton } catch (e: Exception) { 0 })
                          val isStylusOrMouse = toolType == MotionEvent.TOOL_TYPE_STYLUS || toolType == MotionEvent.TOOL_TYPE_MOUSE || isHardwareEraser

                          // XP-Pen Deco Mini 7 V2 Upper Barrel Button:
                          // Holding Upper Barrel + touching/dragging nib sends ACTION_DOWN & ACTION_MOVE with pressure == 0.0f!
                          when (motionEvent.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  isZeroPressureBarrelStroke = isStylusOrMouse && !isHardwareEraser && buttonState == 0 && motionEvent.pressure <= 0.001f
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  // If pressure rises above 0.005f, it is a normal pen stroke, not a 0-pressure barrel stroke
                                  if (motionEvent.pressure > 0.005f) {
                                      isZeroPressureBarrelStroke = false
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  // Keep true through ACTION_UP cleanup, reset right after
                              }
                          }

                          // Lower Barrel Button (Barrel 1): BUTTON_STYLUS_PRIMARY (32) or TOOL_TYPE_ERASER
                          val rawLower = (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) || isHardwareEraser
                          // Upper Barrel Button (Barrel 2): Standard button bits OR XP-Pen 0-pressure barrel contact
                          val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0 || isZeroPressureBarrelStroke"""

          hc = hc.replace(old_barrel_section, new_barrel_section, 1)

          # Also ensure eraser circle cursor is visible during hardware/barrel erasing!
          old_cursor = "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER)) {"
          new_cursor = "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER || isZeroPressureBarrelStroke || prevBarrel1Pressed || prevBarrel2Pressed)) {"
          hc = hc.replace(old_cursor, new_cursor, 1)

          # Reset isZeroPressureBarrelStroke on ACTION_UP/CANCEL
          old_up = "MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                        activeTouchPos = null"
          new_up = "MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                        activeTouchPos = null\n                        isZeroPressureBarrelStroke = false\n                        prevBarrel1Pressed = false\n                        prevBarrel2Pressed = false"
          hc = hc.replace(old_up, new_up, 1)

          hc = hc.replace("sym.hitTest(canvasX, canvasY, padding = 8f)", "sym.hitTest(canvasX, canvasY, padding = 24f)")
          with open(canvas_path, "w", encoding="utf-8") as f:
              f.write(hc)
          print("3. Patched HandwritingCanvas.kt")

          # 4. Patch KeyboardCanvasView.kt:
          #    Same hold-to-erase & 0-pressure barrel erasing inside the IME Keyboard!
          ime_path = "app/src/main/java/com/example/ime/ui/KeyboardCanvasView.kt"
          with open(ime_path, "r", encoding="utf-8") as f:
              ime = f.read()

          ime_state_target = "var liveStroke by remember { mutableStateOf<DrawingStroke?>(null) }"
          ime_state_inject = """var liveStroke by remember { mutableStateOf<DrawingStroke?>(null) }
              var isImeZeroPressureBarrel by remember { mutableStateOf(false) }"""
          ime = ime.replace(ime_state_target, ime_state_inject, 1)

          old_ime_barrel = """                            val pressure = motionEvent.pressure
                                      val buttonState = motionEvent.buttonState
                                      val isBarrel1 = (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) || isEraserHardware
                                      val isBarrel2 = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0

                                      val activeTool = when {
                                          isBarrel1 -> ToolType.STROKE_ERASER
                                          isBarrel2 -> ToolType.HAND
                                          isEraserHardware -> ToolType.STROKE_ERASER
                                          else -> currentTool
                                      }"""

          new_ime_barrel = """                            val pressure = motionEvent.pressure
                                      val buttonState = motionEvent.buttonState or (try { motionEvent.actionButton } catch (e: Exception) { 0 })
                                      when (motionEvent.actionMasked) {
                                          MotionEvent.ACTION_DOWN -> {
                                              isImeZeroPressureBarrel = isStylus && !isEraserHardware && buttonState == 0 && pressure <= 0.001f
                                          }
                                          MotionEvent.ACTION_MOVE -> {
                                              if (pressure > 0.005f) isImeZeroPressureBarrel = false
                                          }
                                      }
                                      val isBarrel1 = (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) || isEraserHardware
                                      val isBarrel2 = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0 || isImeZeroPressureBarrel

                                      val activeTool = when {
                                          isBarrel1 -> ToolType.STROKE_ERASER
                                          isBarrel2 -> ToolType.STROKE_ERASER
                                          isEraserHardware -> ToolType.STROKE_ERASER
                                          else -> currentTool
                                      }"""

          ime = ime.replace(old_ime_barrel, new_ime_barrel, 1)
          ime = ime.replace(
              "MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {",
              "MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {\n                                    isImeZeroPressureBarrel = false",
              1
          )
          ime = ime.replace("hitTestSymbol(sym, canvasX, canvasY, padding = 8f)", "hitTestSymbol(sym, canvasX, canvasY, padding = 22f)")
          with open(ime_path, "w", encoding="utf-8") as f:
              f.write(ime)
          print("4. Patched KeyboardCanvasView.kt")

          # 5. Patch MainActivity.kt & MainViewModel.kt so Settings Hardware Input Monitor shows 0-pressure Upper Barrel Touch!
          main_activity_path = "app/src/main/java/com/example/MainActivity.kt"
          with open(main_activity_path, "r", encoding="utf-8") as f:
              ma = f.read()
          ma_inject = """    override fun dispatchTouchEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && event.pointerCount > 0 && (event.buttonState != 0 || event.getToolType(0) == MotionEvent.TOOL_TYPE_ERASER || (event.getToolType(0) == MotionEvent.TOOL_TYPE_STYLUS && event.pressure <= 0.001f && event.actionMasked == MotionEvent.ACTION_DOWN))) {
                  vm.handleGenericMotionEvent(event)
              }
              return super.dispatchTouchEvent(event)
          }

          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {"""
          if "override fun dispatchTouchEvent" not in ma:
              ma = ma.replace("    override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {", ma_inject, 1)
              with open(main_activity_path, "w", encoding="utf-8") as f:
                  f.write(ma)
          print("5. Patched MainActivity.kt")

          vm_path = "app/src/main/java/com/example/viewmodel/MainViewModel.kt"
          with open(vm_path, "r", encoding="utf-8") as f:
              vm = f.read()
          old_vm_raw = "val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0"
          new_vm_raw = """val isZeroPressureDown = event.pointerCount > 0 && event.getToolType(0) == MotionEvent.TOOL_TYPE_STYLUS && event.pressure <= 0.001f && (event.actionMasked == MotionEvent.ACTION_DOWN || event.actionMasked == MotionEvent.ACTION_MOVE) && event.actionMasked != MotionEvent.ACTION_HOVER_MOVE
                  val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0 || isZeroPressureDown"""
          vm = vm.replace(old_vm_raw, new_vm_raw, 1)
          vm = vm.replace(
              "if (buttonState != 0 || event.actionMasked == MotionEvent.ACTION_BUTTON_PRESS || event.actionMasked == MotionEvent.ACTION_HOVER_MOVE) {",
              "if (buttonState != 0 || isZeroPressureDown || event.actionMasked == MotionEvent.ACTION_BUTTON_PRESS || event.actionMasked == MotionEvent.ACTION_HOVER_MOVE) {",
              1
          )
          with open(vm_path, "w", encoding="utf-8") as f:
              f.write(vm)
          print("6. Patched MainViewModel.kt")

          # 6. Patch ShapeRecognizer.kt
          shape_path = "app/src/main/java/com/example/util/ShapeRecognizer.kt"
          with open(shape_path, "r", encoding="utf-8") as f:
              sr = f.read()
          sr_target = "if (points.size < 6) return stroke // too short to classify as shape"
          sr_inject = """if (points.size < 3) return stroke
              if (stroke.shapeType != ShapeType.NONE) {
                  val s = points.first()
                  val e = points.last()
                  val minX = points.minOf { it.x }
                  val maxX = points.maxOf { it.x }
                  val minY = points.minOf { it.y }
                  val maxY = points.maxOf { it.y }
                  val cx = (minX + maxX) / 2f
                  val cy = (minY + maxY) / 2f
                  when (stroke.shapeType) {
                      ShapeType.LINE -> return stroke.copy(points = listOf(DrawingPoint(s.x, s.y), DrawingPoint(e.x, e.y)), isShape = true, shapeType = ShapeType.LINE)
                      ShapeType.RECTANGLE -> return stroke.copy(points = listOf(DrawingPoint(minX, minY), DrawingPoint(maxX, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(minX, minY)), isShape = true, shapeType = ShapeType.RECTANGLE)
                      ShapeType.TRIANGLE -> return stroke.copy(points = listOf(DrawingPoint(cx, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(cx, minY)), isShape = true, shapeType = ShapeType.TRIANGLE)
                      ShapeType.CIRCLE -> {
                          val r = max(maxX - minX, maxY - minY) / 2f
                          val cPts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + r * cos(ang), cy + r * sin(ang), 1f)
                          }
                          return stroke.copy(points = cPts, isShape = true, shapeType = ShapeType.CIRCLE)
                      }
                      ShapeType.ELLIPSE -> {
                          val a = (maxX - minX) / 2f
                          val b = (maxY - minY) / 2f
                          val ePts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + a * cos(ang), cy + b * sin(ang), 1f)
                          }
                          return stroke.copy(points = ePts, isShape = true, shapeType = ShapeType.ELLIPSE)
                      }
                      else -> {}
                  }
              }
              if (points.size < 6) return stroke"""
          sr = sr.replace(sr_target, sr_inject, 1)
          sr = sr.replace("cv < 0.13f && angularCoverage >= 315f", "cv < 0.22f && angularCoverage >= 275f")
          sr = sr.replace("straightnessRatio >= 0.90f", "straightnessRatio >= 0.85f")
          with open(shape_path, "w", encoding="utf-8") as f:
              f.write(sr)
          print("7. Patched ShapeRecognizer.kt")
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-v1.9-debug-apk
          path: app/build/outputs/apk/debug/*.apk
