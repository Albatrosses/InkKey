name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Project
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          elif [ -f inkkey.zip ]; then
            unzip -o inkkey.zip
            rm -f inkkey.zip
          fi
          for dir in inkkey project InkKey; do
            if [ ! -f settings.gradle.kts ] && [ -d "$dir" ]; then
              mv "$dir"/* . 2>/dev/null || true
              mv "$dir"/.* . 2>/dev/null || true
            fi
          done
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v1.7 Fixes
        run: |
          python3 - << 'EOF'
          import os

          # 1. Update version to 1.7 in app/build.gradle.kts
          app_gradle_path = "app/build.gradle.kts"
          if os.path.exists(app_gradle_path):
              with open(app_gradle_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = bg.replace('versionCode = 4', 'versionCode = 7')
              bg = bg.replace('versionName = "1.3"', 'versionName = "1.7"')
              with open(app_gradle_path, "w", encoding="utf-8") as f:
                  f.write(bg)

          # 2. Patch MainActivity.kt to forward ALL zero-pressure touches, hover button presses, and tablet events to MainViewModel
          main_activity_path = "app/src/main/java/com/example/MainActivity.kt"
          if os.path.exists(main_activity_path):
              with open(main_activity_path, "r", encoding="utf-8") as f:
                  code = f.read()

              old_dispatch = """    override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                  val vm = mainViewModel
                  if (vm != null && vm.handleGenericMotionEvent(event)) {
                      return true
                  }
                  return super.dispatchGenericMotionEvent(event)
              }"""

              new_dispatch = """    override fun dispatchTouchEvent(event: MotionEvent): Boolean {
                  val vm = mainViewModel
                  // Catch ANY zero-pressure touch (whether Android reports it as FINGER=1, STYLUS=2, or MOUSE=3)
                  val isZeroPressureTouch = event.pointerCount > 0 && event.pressure <= 0.001f
                  val isStylusOrEraser = event.pointerCount > 0 && (
                          event.getToolType(0) == MotionEvent.TOOL_TYPE_STYLUS ||
                          event.getToolType(0) == MotionEvent.TOOL_TYPE_ERASER ||
                          event.getToolType(0) == MotionEvent.TOOL_TYPE_MOUSE)
                  if (vm != null && (event.buttonState != 0 || event.actionButton != 0 || isZeroPressureTouch || isStylusOrEraser)) {
                      vm.handleGenericMotionEvent(event)
                  }
                  return super.dispatchTouchEvent(event)
              }

              override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                  val vm = mainViewModel
                  if (vm != null && vm.handleGenericMotionEvent(event)) {
                      return true
                  }
                  return super.dispatchGenericMotionEvent(event)
              }"""

              if "override fun dispatchTouchEvent" not in code:
                  code = code.replace(old_dispatch, new_dispatch)
                  with open(main_activity_path, "w", encoding="utf-8") as f:
                      f.write(code)
                  print("Patched MainActivity.kt")

          # 3. Patch MainViewModel.kt so handleGenericMotionEvent detects:
          #    - Zero-pressure touch events (TOOL_TYPE_FINGER or TOOL_TYPE_STYLUS with pressure == 0f)
          #    - Hover button presses (BUTTON_SECONDARY=2, BUTTON_TERTIARY=4, BUTTON_STYLUS_SECONDARY=64, BUTTON_FORWARD=16, BUTTON_BACK=8)
          #    - Logs every event in Settings -> Hardware Input Monitor so you can see the exact raw numbers
          vm_path = "app/src/main/java/com/example/viewmodel/MainViewModel.kt"
          if os.path.exists(vm_path):
              with open(vm_path, "r", encoding="utf-8") as f:
                  vm_code = f.read()

              old_vm_generic = """    fun handleGenericMotionEvent(event: MotionEvent): Boolean {
                  val buttonState = event.buttonState
                  val isEraserTool = event.pointerCount > 0 && event.getToolType(0) == MotionEvent.TOOL_TYPE_ERASER"""

              new_vm_generic = """    private var lastZeroPressureToggleTime = 0L

              fun handleGenericMotionEvent(event: MotionEvent): Boolean {
                  val buttonState = event.buttonState
                  val actionButton = try { event.actionButton } catch (e: Exception) { 0 }
                  val combinedButtons = buttonState or actionButton
                  val toolTypeInt = if (event.pointerCount > 0) event.getToolType(0) else 0
                  val isEraserTool = toolTypeInt == MotionEvent.TOOL_TYPE_ERASER
                  val pressure = if (event.pointerCount > 0) event.pressure else 0f
                  val action = event.actionMasked

                  // Detect XP-Pen Upper Barrel zero-pressure touch packet (even if Android reports TOOL_TYPE_FINGER or TOOL_TYPE_STYLUS!)
                  val isZeroPressureTouch = (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_MOVE) &&
                          pressure <= 0.001f &&
                          combinedButtons == 0 &&
                          !isEraserTool

                  if (isZeroPressureTouch) {
                      val dev = event.device
                      _latestDebugEvent.value = HardwareInputDebugEvent(
                          eventType = "Zero-Pressure Touch (${MotionEvent.actionToString(action)})",
                          deviceName = dev?.name ?: "XP-Pen / Tablet",
                          deviceId = dev?.id ?: 0,
                          vendorId = dev?.vendorId ?: 0,
                          productId = dev?.productId ?: 0,
                          source = "TOUCH (0.0 Pressure)",
                          buttonState = combinedButtons,
                          buttonStateNames = listOf("Zero-Pressure Upper Barrel"),
                          toolType = "TOOL_TYPE_$toolTypeInt",
                          pressure = pressure,
                          resolvedAction = "Upper Barrel Eraser Toggle"
                      )
                      if (action == MotionEvent.ACTION_DOWN) {
                          val now = System.currentTimeMillis()
                          if (now - lastZeroPressureToggleTime > 250L) {
                              lastZeroPressureToggleTime = now
                              val nextTool = if (_currentTool.value == ToolType.STROKE_ERASER || _currentTool.value == ToolType.AREA_ERASER) {
                                  ToolType.PEN
                              } else {
                                  if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) ToolType.AREA_ERASER else ToolType.STROKE_ERASER
                              }
                              setTool(nextTool)
                              _tabletFeedbackMessage.value = if (nextTool == ToolType.PEN) "Upper Barrel: Switched to Pen" else "Upper Barrel: Switched to Eraser"
                          }
                      }
                      return true
                  }"""

              if "lastZeroPressureToggleTime" not in vm_code:
                  vm_code = vm_code.replace(old_vm_generic, new_vm_generic, 1)

              # Also expand rawUpper detection inside MainViewModel.handleGenericMotionEvent to include BUTTON_SECONDARY (2) and actionButton
              old_vm_upper = "val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0"
              new_vm_upper = "val rawUpper = (combinedButtons and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0"
              vm_code = vm_code.replace(old_vm_upper, new_vm_upper)

              with open(vm_path, "w", encoding="utf-8") as f:
                  f.write(vm_code)
              print("Patched MainViewModel.kt")

          # 4. Patch TabletModels.kt (Default upperBarrelAction to STROKE_ERASER)
          tablet_models_path = "app/src/main/java/com/example/model/TabletModels.kt"
          if os.path.exists(tablet_models_path):
              with open(tablet_models_path, "r", encoding="utf-8") as f:
                  code = f.read()
              code = code.replace(
                  "val upperBarrelAction: TabletAction = TabletAction.HAND,",
                  "val upperBarrelAction: TabletAction = TabletAction.STROKE_ERASER,"
              ).replace(
                  'val upperActionId = prefs.getString("upper_barrel_action", TabletAction.HAND.id)',
                  'val upperActionId = prefs.getString("upper_barrel_action", TabletAction.STROKE_ERASER.id)'
              ).replace(
                  "val upperAction = TabletAction.values().find { it.id == upperActionId } ?: TabletAction.HAND",
                  "val upperAction = TabletAction.values().find { it.id == upperActionId } ?: TabletAction.STROKE_ERASER"
              )
              with open(tablet_models_path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Patched TabletModels.kt")

          # 5. Patch HandwritingCanvas.kt:
          #    - Check zero-pressure touch BEFORE finger/stylus filtering (catches TOOL_TYPE_FINGER=1 AND TOOL_TYPE_STYLUS=2 with 0.0 pressure!)
          #    - Also handle hover events (ACTION_HOVER_MOVE / ACTION_BUTTON_PRESS) directly on the canvas
          canvas_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          if os.path.exists(canvas_path):
              with open(canvas_path, "r", encoding="utf-8") as f:
                  code = f.read()

              old_canvas_top = """                val toolType = motionEvent.getToolType(0)
                          val isFinger = toolType == MotionEvent.TOOL_TYPE_FINGER
                          val isHardwareEraser = toolType == MotionEvent.TOOL_TYPE_ERASER
                          val pointerCount = motionEvent.pointerCount"""

              new_canvas_top = """                val toolType = motionEvent.getToolType(0)
                          val isFinger = toolType == MotionEvent.TOOL_TYPE_FINGER
                          val isHardwareEraser = toolType == MotionEvent.TOOL_TYPE_ERASER
                          val pointerCount = motionEvent.pointerCount
                          val rawBtnState = motionEvent.buttonState or (try { motionEvent.actionButton } catch (e: Exception) { 0 })

                          // Catch XP-Pen Upper Barrel zero-pressure touch packet (even if Android labels it TOOL_TYPE_FINGER=1 or TOOL_TYPE_STYLUS=2!)
                          if (pointerCount == 1 && !isHardwareEraser && rawBtnState == 0 && motionEvent.pressure <= 0.001f) {
                              val act = motionEvent.actionMasked
                              if (act == MotionEvent.ACTION_DOWN || act == MotionEvent.ACTION_MOVE || act == MotionEvent.ACTION_UP) {
                                  viewModel.handleGenericMotionEvent(motionEvent)
                                  return@pointerInteropFilter true
                              }
                          }"""

              if "rawBtnState" not in code:
                  code = code.replace(old_canvas_top, new_canvas_top, 1)

              code = code.replace("sym.hitTest(canvasX, canvasY, padding = 8f)", "sym.hitTest(canvasX, canvasY, padding = 22f)")
              with open(canvas_path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Patched HandwritingCanvas.kt")

          # 6. Patch KeyboardCanvasView.kt:
          #    - Catch zero-pressure touch regardless of whether toolType is FINGER (1) or STYLUS (2)
          ime_canvas_path = "app/src/main/java/com/example/ime/ui/KeyboardCanvasView.kt"
          if os.path.exists(ime_canvas_path):
              with open(ime_canvas_path, "r", encoding="utf-8") as f:
                  code = f.read()

              old_ime = """                            val pressure = motionEvent.pressure
                                      val buttonState = motionEvent.buttonState"""
              new_ime = """                            val pressure = motionEvent.pressure
                                      val buttonState = motionEvent.buttonState or (try { motionEvent.actionButton } catch (e: Exception) { 0 })
                                      val isZeroPressureUpper = !isEraserHardware &&
                                              buttonState == 0 &&
                                              pressure <= 0.001f &&
                                              (motionEvent.actionMasked == MotionEvent.ACTION_DOWN || motionEvent.actionMasked == MotionEvent.ACTION_MOVE || motionEvent.actionMasked == MotionEvent.ACTION_UP)

                                      if (isZeroPressureUpper) {
                                          if (motionEvent.actionMasked == MotionEvent.ACTION_DOWN) {
                                              val toggled = if (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER) ToolType.PEN else ToolType.STROKE_ERASER
                                              repository.setTool(toggled)
                                              notificationMessage = if (toggled == ToolType.PEN) "Upper Barrel: Pen" else "Upper Barrel: Eraser"
                                          }
                                          return@pointerInteropFilter true
                                      }"""
              if "isZeroPressureUpper" not in code:
                  code = code.replace(old_ime, new_ime, 1)
              code = code.replace("isBarrel2 -> ToolType.HAND", "isBarrel2 -> ToolType.STROKE_ERASER")
              code = code.replace("hitTestSymbol(sym, canvasX, canvasY, padding = 8f)", "hitTestSymbol(sym, canvasX, canvasY, padding = 20f)")
              with open(ime_canvas_path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Patched KeyboardCanvasView.kt")

          # 7. Patch ShapeRecognizer.kt
          shape_path = "app/src/main/java/com/example/util/ShapeRecognizer.kt"
          if os.path.exists(shape_path):
              with open(shape_path, "r", encoding="utf-8") as f:
                  code = f.read()

              old_start = """    fun recognizeAndSnap(stroke: DrawingStroke): DrawingStroke {
                  val points = stroke.points
                  if (points.size < 6) return stroke // too short to classify as shape"""

              new_start = """    fun recognizeAndSnap(stroke: DrawingStroke): DrawingStroke {
                  val points = stroke.points
                  if (points.size < 3) return stroke
                  if (stroke.shapeType != ShapeType.NONE) {
                      val s = points.first()
                      val e = points.last()
                      val minX = points.minOf { it.x }
                      val maxX = points.maxOf { it.x }
                      val minY = points.minOf { it.y }
                      val maxY = points.maxOf { it.y }
                      val cx = (minX + maxX) / 2f
                      val cy = (minY + maxY) / 2f
                      when (stroke.shapeType) {
                          ShapeType.LINE -> return stroke.copy(points = listOf(DrawingPoint(s.x, s.y), DrawingPoint(e.x, e.y)), isShape = true, shapeType = ShapeType.LINE)
                          ShapeType.RECTANGLE -> return stroke.copy(points = listOf(DrawingPoint(minX, minY), DrawingPoint(maxX, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(minX, minY)), isShape = true, shapeType = ShapeType.RECTANGLE)
                          ShapeType.TRIANGLE -> return stroke.copy(points = listOf(DrawingPoint(cx, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(cx, minY)), isShape = true, shapeType = ShapeType.TRIANGLE)
                          ShapeType.CIRCLE -> {
                              val r = max(maxX - minX, maxY - minY) / 2f
                              val cPts = (0..48).map { idx ->
                                  val ang = 2f * PI.toFloat() * idx / 48
                                  DrawingPoint(cx + r * cos(ang), cy + r * sin(ang), 1f)
                              }
                              return stroke.copy(points = cPts, isShape = true, shapeType = ShapeType.CIRCLE)
                          }
                          ShapeType.ELLIPSE -> {
                              val a = (maxX - minX) / 2f
                              val b = (maxY - minY) / 2f
                              val ePts = (0..48).map { idx ->
                                  val ang = 2f * PI.toFloat() * idx / 48
                                  DrawingPoint(cx + a * cos(ang), cy + b * sin(ang), 1f)
                              }
                              return stroke.copy(points = ePts, isShape = true, shapeType = ShapeType.ELLIPSE)
                          }
                          else -> {}
                      }
                  }
                  if (points.size < 6) return stroke"""

              code = code.replace(old_start, new_start)
              code = code.replace("cv < 0.13f && angularCoverage >= 315f", "cv < 0.22f && angularCoverage >= 275f")
              code = code.replace("straightnessRatio >= 0.90f", "straightnessRatio >= 0.85f")
              with open(shape_path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Patched ShapeRecognizer.kt")
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-v1.7-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
