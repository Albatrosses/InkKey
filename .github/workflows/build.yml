name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Project
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          elif [ -f inkkey.zip ]; then
            unzip -o inkkey.zip
            rm -f inkkey.zip
          fi
          for dir in inkkey project InkKey; do
            if [ ! -f settings.gradle.kts ] && [ -d "$dir" ]; then
              mv "$dir"/* . 2>/dev/null || true
              mv "$dir"/.* . 2>/dev/null || true
            fi
          done
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          rm -f InkKey.apk
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v2.2 Fixes
        run: |
          python3 - << 'EOF'
          import os, sys

          # 1. Update version to 2.2
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              bg = f.read()
          bg = bg.replace('versionCode = 4', 'versionCode = 12').replace('versionName = "1.3"', 'versionName = "2.2"')
          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(bg)

          # 2. Patch MainActivity.kt (Intercept KeyEvents, TouchEvents, and GenericMotionEvents)
          ma_path = "app/src/main/java/com/example/MainActivity.kt"
          with open(ma_path, "r", encoding="utf-8") as f:
              ma = f.read()

          old_ma = """    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleHardwareKeyEvent(event.keyCode, event.scanCode, event)) {
                  return true
              }
              return super.dispatchKeyEvent(event)
          }
          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleGenericMotionEvent(event)) {
                  return true
              }
              return super.dispatchGenericMotionEvent(event)
          }"""

          new_ma = """    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleHardwareKeyEvent(event.keyCode, event.scanCode, event)) {
                  return true
              }
              return super.dispatchKeyEvent(event)
          }

          override fun dispatchTouchEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.onRawTabletTouchEvent(event)) {
                  return true
              }
              return super.dispatchTouchEvent(event)
          }

          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleGenericMotionEvent(event)) {
                  return true
              }
              return super.dispatchGenericMotionEvent(event)
          }"""

          if "onRawTabletTouchEvent" not in ma:
              ma = ma.replace("    override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {", """    override fun dispatchTouchEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.onRawTabletTouchEvent(event)) {
                  return true
              }
              return super.dispatchTouchEvent(event)
          }

          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {""", 1)
              with open(ma_path, "w", encoding="utf-8") as f:
                  f.write(ma)

          # 3. Patch MainViewModel.kt safely (injects onRawTabletTouchEvent without removing any existing variables!)
          vm_path = "app/src/main/java/com/example/viewmodel/MainViewModel.kt"
          with open(vm_path, "r", encoding="utf-8") as f:
              vm = f.read()

          inject_vm = """    private var upperBarrelZeroPressureActive = false
          private var upperBarrelStartX = 0f
          private var upperBarrelStartY = 0f
          private var lastUpperBarrelClickMs = 0L

          fun onRawTabletTouchEvent(event: MotionEvent): Boolean {
              val action = event.actionMasked
              val buttonState = event.buttonState or event.actionButton
              val pressure = if (event.pointerCount > 0) event.pressure else 0f
              val toolType = if (event.pointerCount > 0) event.getToolType(0) else 0
              val dev = event.device
              val isStylusOrTablet = (toolType == MotionEvent.TOOL_TYPE_STYLUS) ||
                      (toolType == MotionEvent.TOOL_TYPE_MOUSE) ||
                      (dev?.vendorId == 0x28BD) ||
                      (dev?.name?.contains("Deco", ignoreCase = true) == true) ||
                      (dev?.name?.contains("UGTABLET", ignoreCase = true) == true)

              if (buttonState != 0 || toolType == MotionEvent.TOOL_TYPE_ERASER) {
                  handleGenericMotionEvent(event)
              }

              // XP-Pen Upper Barrel sends ACTION_DOWN with 0% pressure (pressure == 0.0f)
              if (action == MotionEvent.ACTION_DOWN) {
                  if (isStylusOrTablet && buttonState == 0 && toolType != MotionEvent.TOOL_TYPE_ERASER && pressure <= 0.0005f) {
                      upperBarrelZeroPressureActive = true
                      upperBarrelStartX = event.x
                      upperBarrelStartY = event.y

                      val now = System.currentTimeMillis()
                      if (now - lastUpperBarrelClickMs > 250L) {
                          lastUpperBarrelClickMs = now
                          val nextTool = if (_currentTool.value == ToolType.STROKE_ERASER || _currentTool.value == ToolType.AREA_ERASER) {
                              ToolType.PEN
                          } else {
                              if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) ToolType.AREA_ERASER else ToolType.STROKE_ERASER
                          }
                          setTool(nextTool)
                          val msg = if (nextTool == ToolType.PEN) {
                              "Upper Barrel: Switched to Pen"
                          } else {
                              "Upper Barrel: Switched to ${if (nextTool == ToolType.AREA_ERASER) "Area " else "Stroke "}Eraser"
                          }
                          _tabletFeedbackMessage.value = msg
                          _latestDebugEvent.value = HardwareInputDebugEvent(
                              eventType = "Upper Barrel (ACTION_DOWN 0% Pressure)",
                              deviceName = dev?.name ?: "UGTABLET Deco Mini7 V2",
                              deviceId = dev?.id ?: 0,
                              vendorId = dev?.vendorId ?: 0x28BD,
                              productId = dev?.productId ?: 0x0948,
                              source = "UPPER BARREL (0% Pressure)",
                              buttonState = 0x40,
                              buttonStateNames = listOf("Upper Barrel (0% Pressure)"),
                              toolType = "TOOL_$toolType",
                              pressure = pressure,
                              resolvedAction = msg
                          )
                      }
                      return true
                  } else {
                      upperBarrelZeroPressureActive = false
                  }
              } else if (action == MotionEvent.ACTION_MOVE && upperBarrelZeroPressureActive) {
                  if (pressure <= 0.0005f) {
                      val dist = kotlin.math.hypot(event.x - upperBarrelStartX, event.y - upperBarrelStartY)
                      if (dist > 6f) {
                          val cx = (event.x - _panOffset.value.x) / _zoomScale.value
                          val cy = (event.y - _panOffset.value.y) / _zoomScale.value
                          if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) {
                              eraseAreaStrokes(cx, cy, _eraserSize.value.radius)
                          } else {
                              eraseStrokesNear(cx, cy, _eraserSize.value.radius)
                          }
                      }
                      return true
                  } else {
                      upperBarrelZeroPressureActive = false
                  }
              } else if ((action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) && upperBarrelZeroPressureActive) {
                  upperBarrelZeroPressureActive = false
                  return true
              }
              return false
          }

          fun handleGenericMotionEvent(event: MotionEvent): Boolean {"""

          if "fun onRawTabletTouchEvent" not in vm:
              vm = vm.replace("    fun handleGenericMotionEvent(event: MotionEvent): Boolean {", inject_vm, 1)

          # Stop empty ACTION_HOVER_MOVE from overwriting the monitor
          vm = vm.replace("|| event.actionMasked == MotionEvent.ACTION_HOVER_MOVE", "")
          with open(vm_path, "w", encoding="utf-8") as f:
              f.write(vm)

          # 4. Patch TabletModels.kt, HandwritingCanvas.kt, KeyboardCanvasView.kt, ShapeRecognizer.kt
          tm_path = "app/src/main/java/com/example/model/TabletModels.kt"
          with open(tm_path, "r", encoding="utf-8") as f:
              tm = f.read()
          tm = tm.replace("val upperBarrelAction: TabletAction = TabletAction.HAND", "val upperBarrelAction: TabletAction = TabletAction.STROKE_ERASER")
          tm = tm.replace("TabletAction.HAND.id", "TabletAction.STROKE_ERASER.id")
          tm = tm.replace("?: TabletAction.HAND", "?: TabletAction.STROKE_ERASER")
          with open(tm_path, "w", encoding="utf-8") as f:
              f.write(tm)

          hc_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          with open(hc_path, "r", encoding="utf-8") as f:
              hc = f.read()
          hc = hc.replace("sym.hitTest(canvasX, canvasY, padding = 8f)", "sym.hitTest(canvasX, canvasY, padding = 24f)")
          with open(hc_path, "w", encoding="utf-8") as f:
              f.write(hc)

          ime_path = "app/src/main/java/com/example/ime/ui/KeyboardCanvasView.kt"
          with open(ime_path, "r", encoding="utf-8") as f:
              ime = f.read()
          ime = ime.replace("isBarrel2 -> ToolType.HAND", "isBarrel2 -> ToolType.STROKE_ERASER")
          ime = ime.replace("hitTestSymbol(sym, canvasX, canvasY, padding = 8f)", "hitTestSymbol(sym, canvasX, canvasY, padding = 22f)")
          with open(ime_path, "w", encoding="utf-8") as f:
              f.write(ime)

          shape_path = "app/src/main/java/com/example/util/ShapeRecognizer.kt"
          with open(shape_path, "r", encoding="utf-8") as f:
              sr = f.read()
          sr_target = "if (points.size < 6) return stroke // too short to classify as shape"
          sr_inject = """if (points.size < 3) return stroke
              if (stroke.shapeType != ShapeType.NONE) {
                  val s = points.first()
                  val e = points.last()
                  val minX = points.minOf { it.x }
                  val maxX = points.maxOf { it.x }
                  val minY = points.minOf { it.y }
                  val maxY = points.maxOf { it.y }
                  val cx = (minX + maxX) / 2f
                  val cy = (minY + maxY) / 2f
                  when (stroke.shapeType) {
                      ShapeType.LINE -> return stroke.copy(points = listOf(DrawingPoint(s.x, s.y), DrawingPoint(e.x, e.y)), isShape = true, shapeType = ShapeType.LINE)
                      ShapeType.RECTANGLE -> return stroke.copy(points = listOf(DrawingPoint(minX, minY), DrawingPoint(maxX, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(minX, minY)), isShape = true, shapeType = ShapeType.RECTANGLE)
                      ShapeType.TRIANGLE -> return stroke.copy(points = listOf(DrawingPoint(cx, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(cx, minY)), isShape = true, shapeType = ShapeType.TRIANGLE)
                      ShapeType.CIRCLE -> {
                          val r = max(maxX - minX, maxY - minY) / 2f
                          val cPts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + r * cos(ang), cy + r * sin(ang), 1f)
                          }
                          return stroke.copy(points = cPts, isShape = true, shapeType = ShapeType.CIRCLE)
                      }
                      ShapeType.ELLIPSE -> {
                          val a = (maxX - minX) / 2f
                          val b = (maxY - minY) / 2f
                          val ePts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + a * cos(ang), cy + b * sin(ang), 1f)
                          }
                          return stroke.copy(points = ePts, isShape = true, shapeType = ShapeType.ELLIPSE)
                      }
                      else -> {}
                  }
              }
              if (points.size < 6) return stroke"""
          sr = sr.replace(sr_target, sr_inject, 1)
          sr = sr.replace("cv < 0.13f && angularCoverage >= 315f", "cv < 0.22f && angularCoverage >= 275f")
          sr = sr.replace("straightnessRatio >= 0.90f", "straightnessRatio >= 0.85f")
          with open(shape_path, "w", encoding="utf-8") as f:
              f.write(sr)
          EOF

      - name: Save Unpacked Source Files to GitHub Repo (One-Time Cleanup)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Unpack project.zip and apply InkKey v2.2 fixes [skip ci]"
            git push || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-v2.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
