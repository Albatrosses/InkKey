name: Build InkKey APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Project
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip
            rm -f project.zip
          elif [ -f inkkey.zip ]; then
            unzip -o inkkey.zip
            rm -f inkkey.zip
          fi
          for dir in inkkey project InkKey; do
            if [ ! -f settings.gradle.kts ] && [ -d "$dir" ]; then
              mv "$dir"/* . 2>/dev/null || true
              mv "$dir"/.* . 2>/dev/null || true
            fi
          done
          if [ -f InkKey_Source_Code.zip ]; then
            unzip -o InkKey_Source_Code.zip
            rm -f InkKey_Source_Code.zip
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=placeholder" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=placeholder" > .env.example
          fi

      - name: Apply InkKey v2.2 Verified Fixes
        run: |
          python3 - << 'EOF'
          import os, sys

          def replace_kotlin_fun(source, fun_signature, new_fun_code):
              idx = source.find(fun_signature)
              if idx == -1:
                  print(f"ERROR: Could not find {fun_signature}")
                  sys.exit(1)
              brace_start = source.find("{", idx)
              depth = 0
              end_idx = -1
              for i in range(brace_start, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end_idx = i + 1
                          break
              if end_idx == -1:
                  print(f"ERROR: Could not match braces for {fun_signature}")
                  sys.exit(1)
              return source[:idx] + new_fun_code + source[end_idx:]

          # 1. Update version to 2.2 in app/build.gradle.kts
          app_gradle_path = "app/src/main/java/com/example/MainActivity.kt"
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              bg = f.read()
          bg = bg.replace('versionCode = 4', 'versionCode = 12').replace('versionName = "1.3"', 'versionName = "2.2"')
          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(bg)

          # 2. Replace MainActivity.kt event dispatchers completely so Touch, Hover, and KeyEvents ALL reach MainViewModel
          with open("app/src/main/java/com/example/MainActivity.kt", "r", encoding="utf-8") as f:
              ma = f.read()

          new_dispatch_generic = """override fun dispatchTouchEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.onRawTabletTouchEvent(event)) {
                  return true
              }
              return super.dispatchTouchEvent(event)
          }

          override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
              val vm = mainViewModel
              if (vm != null && vm.handleGenericMotionEvent(event)) {
                  return true
              }
              return super.dispatchGenericMotionEvent(event)
          }"""

          ma = replace_kotlin_fun(ma, "override fun dispatchGenericMotionEvent", new_dispatch_generic)
          with open("app/src/main/java/com/example/MainActivity.kt", "w", encoding="utf-8") as f:
              f.write(ma)
          print("VERIFIED: MainActivity.kt patched")

          # 3. Replace handleGenericMotionEvent in MainViewModel.kt using brace-matching (100% guaranteed to apply!)
          vm_path = "app/src/main/java/com/example/viewmodel/MainViewModel.kt"
          with open(vm_path, "r", encoding="utf-8") as f:
              vm = f.read()

          new_vm_functions = """private var upperBarrelZeroPressureActive = false
          private var upperBarrelStartX = 0f
          private var upperBarrelStartY = 0f
          private var upperBarrelDidEraseDrag = false
          private var lastUpperBarrelClickMs = 0L

          fun onRawTabletTouchEvent(event: MotionEvent): Boolean {
              val action = event.actionMasked
              val buttonState = event.buttonState or (try { event.actionButton } catch (e: Exception) { 0 })
              val pressure = if (event.pointerCount > 0) event.pressure else 0f
              val toolType = if (event.pointerCount > 0) event.getToolType(0) else 0
              val dev = event.device
              val isStylusOrTablet = (toolType == MotionEvent.TOOL_TYPE_STYLUS) ||
                      (toolType == MotionEvent.TOOL_TYPE_MOUSE) ||
                      (dev?.vendorId == 0x28BD) ||
                      (dev?.name?.contains("Deco", ignoreCase = true) == true) ||
                      (dev?.name?.contains("UGTABLET", ignoreCase = true) == true)

              // CRITICAL FIX FOR XP-PEN DECO MINI 7 V2:
              // Pressing the Upper Barrel Button sends ACTION_DOWN with pressure == 0.0f (0%)!
              // Normal pen writing ALWAYS starts with ACTION_DOWN pressure > 0.0f (and only hits 0% on ACTION_MOVE when lifting the pen).
              // By checking ONLY on ACTION_DOWN that pressure <= 0.0005f, normal writing NEVER false-triggers, and Upper Barrel ALWAYS triggers!
              if (action == MotionEvent.ACTION_DOWN) {
                  if (isStylusOrTablet && buttonState == 0 && toolType != MotionEvent.TOOL_TYPE_ERASER && pressure <= 0.0005f) {
                      upperBarrelZeroPressureActive = true
                      upperBarrelDidEraseDrag = false
                      upperBarrelStartX = event.x
                      upperBarrelStartY = event.y

                      val now = System.currentTimeMillis()
                      if (now - lastUpperBarrelClickMs > 220L) {
                          lastUpperBarrelClickMs = now
                          val nextTool = if (_currentTool.value == ToolType.STROKE_ERASER || _currentTool.value == ToolType.AREA_ERASER) {
                              ToolType.PEN
                          } else {
                              if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) ToolType.AREA_ERASER else ToolType.STROKE_ERASER
                          }
                          setTool(nextTool)
                          val msg = if (nextTool == ToolType.PEN) {
                              "Upper Barrel: Switched to Pen"
                          } else {
                              "Upper Barrel: Switched to ${if (nextTool == ToolType.AREA_ERASER) "Area " else "Stroke "}Eraser"
                          }
                          _tabletFeedbackMessage.value = msg
                          _latestDebugEvent.value = HardwareInputDebugEvent(
                              eventType = "Upper Barrel Press (ACTION_DOWN 0% Pressure)",
                              deviceName = dev?.name ?: "UGTABLET Deco Mini7 V2",
                              deviceId = dev?.id ?: 0,
                              vendorId = dev?.vendorId ?: 0x28BD,
                              productId = dev?.productId ?: 0x0948,
                              source = "UPPER BARREL BUTTON",
                              buttonState = 0x40,
                              buttonStateNames = listOf("Upper Barrel Button (0% Pressure)"),
                              toolType = "STYLUS",
                              pressure = pressure,
                              resolvedAction = msg
                          )
                      }
                      // Consume this 0-pressure tap so it doesn't draw a phantom dot on the canvas
                      return true
                  } else {
                      upperBarrelZeroPressureActive = false
                  }
              } else if (action == MotionEvent.ACTION_MOVE && upperBarrelZeroPressureActive) {
                  // If pressure stays 0% while dragging with Upper Barrel held down, erase directly at (x, y)!
                  if (pressure <= 0.0005f) {
                      val dist = kotlin.math.hypot(event.x - upperBarrelStartX, event.y - upperBarrelStartY)
                      if (dist > 8f) {
                          upperBarrelDidEraseDrag = true
                          val cx = (event.x - _panOffset.value.x) / _zoomScale.value
                          val cy = (event.y - _panOffset.value.y) / _zoomScale.value
                          if (_tabletConfig.value.upperBarrelAction == TabletAction.AREA_ERASER) {
                              eraseAreaStrokes(cx, cy, _eraserSize.value.radius)
                          } else {
                              eraseStrokesNear(cx, cy, _eraserSize.value.radius)
                          }
                      }
                      return true
                  } else {
                      // Pen tip pressed down with real pressure (> 0%)
                      upperBarrelZeroPressureActive = false
                  }
              } else if ((action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) && upperBarrelZeroPressureActive) {
                  upperBarrelZeroPressureActive = false
                  return true
              }

              if (buttonState != 0 || toolType == MotionEvent.TOOL_TYPE_ERASER) {
                  handleGenericMotionEvent(event)
              }
              return false
          }

          fun handleGenericMotionEvent(event: MotionEvent): Boolean {
              val dev = event.device
              val buttonState = event.buttonState or (try { event.actionButton } catch (e: Exception) { 0 })
              val actionMasked = event.actionMasked
              val isEraserTool = event.pointerCount > 0 && event.getToolType(0) == MotionEvent.TOOL_TYPE_ERASER

              val buttonNames = mutableListOf<String>()
              if (buttonState and MotionEvent.BUTTON_PRIMARY != 0) buttonNames.add("Tip (Primary)")
              if (buttonState and MotionEvent.BUTTON_SECONDARY != 0) buttonNames.add("Barrel 2 (Secondary / Right-Click)")
              if (buttonState and MotionEvent.BUTTON_TERTIARY != 0) buttonNames.add("Barrel 2 (Tertiary)")
              if (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) buttonNames.add("Stylus Lower Barrel (0x20)")
              if (buttonState and MotionEvent.BUTTON_STYLUS_SECONDARY != 0) buttonNames.add("Stylus Upper Barrel (0x40)")
              if (buttonState and MotionEvent.BUTTON_FORWARD != 0) buttonNames.add("Forward (Barrel 2)")
              if (buttonState and MotionEvent.BUTTON_BACK != 0) buttonNames.add("Back (Barrel 2)")

              val rawLower = (buttonState and MotionEvent.BUTTON_STYLUS_PRIMARY != 0) || isEraserTool
              val rawUpper = (buttonState and (MotionEvent.BUTTON_STYLUS_SECONDARY or MotionEvent.BUTTON_SECONDARY or MotionEvent.BUTTON_TERTIARY or MotionEvent.BUTTON_FORWARD or MotionEvent.BUTTON_BACK)) != 0

              val isBarrel1 = if (_tabletConfig.value.swapBarrelButtons) rawUpper else rawLower
              val isBarrel2 = if (_tabletConfig.value.swapBarrelButtons) rawLower else rawUpper

              val resolved = when {
                  isBarrel1 -> "Lower Barrel: ${_tabletConfig.value.lowerBarrelAction.displayName}"
                  isBarrel2 -> "Upper Barrel: ${_tabletConfig.value.upperBarrelAction.displayName}"
                  else -> ""
              }

              // ONLY update the Hardware Input Event Monitor when an actual button is pressed!
              // Do NOT let empty ACTION_HOVER_MOVE overwrite the monitor!
              if (buttonState != 0 || isEraserTool || actionMasked == MotionEvent.ACTION_BUTTON_PRESS) {
                  val toolStr = if (event.pointerCount > 0) {
                      when (event.getToolType(0)) {
                          MotionEvent.TOOL_TYPE_FINGER -> "FINGER"
                          MotionEvent.TOOL_TYPE_STYLUS -> "STYLUS"
                          MotionEvent.TOOL_TYPE_MOUSE -> "MOUSE"
                          MotionEvent.TOOL_TYPE_ERASER -> "ERASER"
                          else -> "UNKNOWN"
                      }
                  } else "NONE"

                  _latestDebugEvent.value = HardwareInputDebugEvent(
                      eventType = "MotionEvent (${MotionEvent.actionToString(actionMasked)})",
                      deviceName = dev?.name ?: "Stylus / Tablet",
                      deviceId = dev?.id ?: 0,
                      vendorId = dev?.vendorId ?: 0,
                      productId = dev?.productId ?: 0,
                      source = "STYLUS / TABLET",
                      buttonState = buttonState,
                      buttonStateNames = buttonNames,
                      toolType = toolStr,
                      pressure = if (event.pointerCount > 0) event.pressure else 0f,
                      resolvedAction = resolved
                  )
              }

              if (isBarrel1 && !prevHoverBarrel1) {
                  val act = _tabletConfig.value.lowerBarrelAction
                  executeTabletAction(act)
                  _tabletFeedbackMessage.value = "Lower Barrel: ${act.displayName}"
              }
              prevHoverBarrel1 = isBarrel1

              if (isBarrel2 && !prevHoverBarrel2) {
                  val act = _tabletConfig.value.upperBarrelAction
                  executeTabletAction(act)
                  _tabletFeedbackMessage.value = "Upper Barrel: ${act.displayName}"
              }
              prevHoverBarrel2 = isBarrel2

              if (actionMasked == MotionEvent.ACTION_UP || actionMasked == MotionEvent.ACTION_CANCEL || actionMasked == MotionEvent.ACTION_HOVER_EXIT) {
                  prevHoverBarrel1 = false
                  prevHoverBarrel2 = false
              }
              return isBarrel1 || isBarrel2
          }"""

          vm = replace_kotlin_fun(vm, "fun handleGenericMotionEvent(event: MotionEvent): Boolean", new_vm_functions)
          with open(vm_path, "w", encoding="utf-8") as f:
              f.write(vm)
          print("VERIFIED: MainViewModel.kt handleGenericMotionEvent replaced!")

          # 4. Patch TabletModels.kt (Default upperBarrelAction to STROKE_ERASER)
          tablet_models_path = "app/src/main/java/com/example/model/TabletModels.kt"
          with open(tablet_models_path, "r", encoding="utf-8") as f:
              tm = f.read()
          tm = tm.replace("val upperBarrelAction: TabletAction = TabletAction.HAND", "val upperBarrelAction: TabletAction = TabletAction.STROKE_ERASER")
          tm = tm.replace("TabletAction.HAND.id", "TabletAction.STROKE_ERASER.id")
          tm = tm.replace("?: TabletAction.HAND", "?: TabletAction.STROKE_ERASER")
          with open(tablet_models_path, "w", encoding="utf-8") as f:
              f.write(tm)
          print("VERIFIED: TabletModels.kt patched")

          # 5. Patch HandwritingCanvas.kt (Widened symbol hit-box + eraser cursor visibility)
          canvas_path = "app/src/main/java/com/example/ui/canvas/HandwritingCanvas.kt"
          with open(canvas_path, "r", encoding="utf-8") as f:
              hc = f.read()
          hc = hc.replace("sym.hitTest(canvasX, canvasY, padding = 8f)", "sym.hitTest(canvasX, canvasY, padding = 24f)")
          hc = hc.replace(
              "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER)) {",
              "if (activeTouchPos != null && (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER || prevBarrel1Pressed || prevBarrel2Pressed)) {"
          )
          with open(canvas_path, "w", encoding="utf-8") as f:
              f.write(hc)
          print("VERIFIED: HandwritingCanvas.kt patched")

          # 6. Patch KeyboardCanvasView.kt (Same ACTION_DOWN 0% pressure check for Upper Barrel in IME Keyboard)
          ime_path = "app/src/main/java/com/example/ime/ui/KeyboardCanvasView.kt"
          with open(ime_path, "r", encoding="utf-8") as f:
              ime = f.read()

          ime_target = "when (motionEvent.actionMasked) {\n                                MotionEvent.ACTION_DOWN -> {"
          ime_inject = """when (motionEvent.actionMasked) {
                                MotionEvent.ACTION_DOWN -> {
                                    // XP-Pen Upper Barrel sends ACTION_DOWN with 0% pressure!
                                    if (isStylus && !isEraserHardware && buttonState == 0 && pressure <= 0.0005f) {
                                        val nextT = if (currentTool == ToolType.STROKE_ERASER || currentTool == ToolType.AREA_ERASER) ToolType.PEN else ToolType.STROKE_ERASER
                                        repository.setTool(nextT)
                                        notificationMessage = if (nextT == ToolType.PEN) "Upper Barrel: Switched to Pen" else "Upper Barrel: Switched to Eraser"
                                        return@pointerInteropFilter true
                                    }"""
          if "Upper Barrel: Switched to Eraser" not in ime:
              ime = ime.replace(ime_target, ime_inject, 1)

          ime = ime.replace("isBarrel2 -> ToolType.HAND", "isBarrel2 -> ToolType.STROKE_ERASER")
          ime = ime.replace("hitTestSymbol(sym, canvasX, canvasY, padding = 8f)", "hitTestSymbol(sym, canvasX, canvasY, padding = 22f)")
          with open(ime_path, "w", encoding="utf-8") as f:
              f.write(ime)
          print("VERIFIED: KeyboardCanvasView.kt patched")

          # 7. Patch ShapeRecognizer.kt
          shape_path = "app/src/main/java/com/example/util/ShapeRecognizer.kt"
          with open(shape_path, "r", encoding="utf-8") as f:
              sr = f.read()
          sr_target = "if (points.size < 6) return stroke // too short to classify as shape"
          sr_inject = """if (points.size < 3) return stroke
              if (stroke.shapeType != ShapeType.NONE) {
                  val s = points.first()
                  val e = points.last()
                  val minX = points.minOf { it.x }
                  val maxX = points.maxOf { it.x }
                  val minY = points.minOf { it.y }
                  val maxY = points.maxOf { it.y }
                  val cx = (minX + maxX) / 2f
                  val cy = (minY + maxY) / 2f
                  when (stroke.shapeType) {
                      ShapeType.LINE -> return stroke.copy(points = listOf(DrawingPoint(s.x, s.y), DrawingPoint(e.x, e.y)), isShape = true, shapeType = ShapeType.LINE)
                      ShapeType.RECTANGLE -> return stroke.copy(points = listOf(DrawingPoint(minX, minY), DrawingPoint(maxX, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(minX, minY)), isShape = true, shapeType = ShapeType.RECTANGLE)
                      ShapeType.TRIANGLE -> return stroke.copy(points = listOf(DrawingPoint(cx, minY), DrawingPoint(maxX, maxY), DrawingPoint(minX, maxY), DrawingPoint(cx, minY)), isShape = true, shapeType = ShapeType.TRIANGLE)
                      ShapeType.CIRCLE -> {
                          val r = max(maxX - minX, maxY - minY) / 2f
                          val cPts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + r * cos(ang), cy + r * sin(ang), 1f)
                          }
                          return stroke.copy(points = cPts, isShape = true, shapeType = ShapeType.CIRCLE)
                      }
                      ShapeType.ELLIPSE -> {
                          val a = (maxX - minX) / 2f
                          val b = (maxY - minY) / 2f
                          val ePts = (0..48).map { idx ->
                              val ang = 2f * PI.toFloat() * idx / 48
                              DrawingPoint(cx + a * cos(ang), cy + b * sin(ang), 1f)
                          }
                          return stroke.copy(points = ePts, isShape = true, shapeType = ShapeType.ELLIPSE)
                      }
                      else -> {}
                  }
              }
              if (points.size < 6) return stroke"""
          sr = sr.replace(sr_target, sr_inject, 1)
          sr = sr.replace("cv < 0.13f && angularCoverage >= 315f", "cv < 0.22f && angularCoverage >= 275f")
          sr = sr.replace("straightnessRatio >= 0.90f", "straightnessRatio >= 0.85f")
          with open(shape_path, "w", encoding="utf-8") as f:
              f.write(sr)
          print("VERIFIED: ShapeRecognizer.kt patched")
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore (if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: InkKey-v2.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
